name: E2E (MVP PA)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    name: Playwright (Chromium) - Fluxo Feliz #1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      E2E_BACKEND_URL: http://localhost:8080/api/v1
      E2E_FRONTEND_URL: http://localhost:5173
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend (para subir stack local)
        uses: actions/checkout@v4
        with:
          repository: 81wallace18/AmazHealth-backend
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: AmazHealth-backend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps (frontend)
        run: npm ci

      - name: Start backend + DB (docker compose)
        working-directory: AmazHealth-backend
        run: |
          cp .env.example .env
          docker compose -f docker/docker-compose.yml up -d --build

      - name: Start frontend dev server
        run: |
          VITE_API_URL="${E2E_BACKEND_URL}" npm run dev -- --host 127.0.0.1 --port 5173 > vite.log 2>&1 &
          echo $! > vite.pid

      - name: Wait for backend/frontend
        run: |
          set -euo pipefail

          echo "Aguardando backend..."
          backend_ok=0
          for i in $(seq 1 60); do
            if curl -fsS "${E2E_BACKEND_URL}/status" > /dev/null; then
              echo "Backend OK"
              backend_ok=1
              break
            fi
            sleep 2
          done
          if [ "${backend_ok}" -ne 1 ]; then
            echo "Backend não ficou pronto a tempo."
            exit 1
          fi

          echo "Aguardando frontend..."
          frontend_ok=0
          for i in $(seq 1 60); do
            if curl -fsS "${E2E_FRONTEND_URL}" > /dev/null; then
              echo "Frontend OK"
              frontend_ok=1
              break
            fi
            sleep 2
          done
          if [ "${frontend_ok}" -ne 1 ]; then
            echo "Frontend não ficou pronto a tempo."
            exit 1
          fi

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npx playwright test e2e/mvp-pa-fluxo.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Teardown
        if: always()
        run: |
          if [ -f vite.pid ]; then
            kill "$(cat vite.pid)" || true
          fi

          if [ -d "AmazHealth-backend" ]; then
            cd AmazHealth-backend
            docker compose -f docker/docker-compose.yml down -v || true
          fi
