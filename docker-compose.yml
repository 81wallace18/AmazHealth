services:
  # Desenvolvimento do frontend (hot-reload)
  web-dev:
    profiles: ["dev"]
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080/api/v1
    volumes:
      - ./:/app
      - /app/node_modules

  # Serviço backend Spring Boot
  backend:
    profiles: ["backend", "dev"]
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/amazhealth
      SPRING_DATASOURCE_USERNAME: amaz
      SPRING_DATASOURCE_PASSWORD: amazsecret
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ~/.m2:/root/.m2  # Para reutilizar cache do Maven/Gradle

  # Banco de dados para o backend
  db:
    profiles: ["backend", "dev"]
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=amazhealth
      - POSTGRES_USER=amaz
      - POSTGRES_PASSWORD=amazsecret
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amaz -d amazhealth"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
