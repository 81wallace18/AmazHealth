services:
  # Produção do frontend (build + serve estático com NGINX)
  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # Em uso local (prod-like), o backend normalmente roda em http://localhost:18080.
        # Em produção, preferir setar VITE_API_URL no ambiente/CI (ex.: /api/v1 ou https://seu-dominio/api/v1).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:18080/api/v1}
    ports:
      - "8081:80" # Acesse em http://localhost:8081
    restart: unless-stopped

  # Desenvolvimento do frontend (hot-reload)
  web-dev:
    profiles: ["dev"]
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:18080/api/v1
    volumes:
      - ./:/app
      - /app/node_modules
